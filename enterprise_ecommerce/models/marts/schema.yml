version: 2

models:
  - name: fct_orders
    description: "Analytics-ready order fact table at one row per order."

    columns:
      - name: order_id
        description: "Unique identifier for the order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null

      - name: order_date
        description: "Date the order was placed."
        data_tests:
          - not_null

      - name: status
        description: "Current status of the order."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - pending
                  - cancelled

      - name: currency
        description: "Currency used for the order."
        data_tests:
          - not_null

      - name: order_total
        description: "Order total provided by the source system."
        data_tests:
          - not_null

      - name: calculated_order_total
        description: "Order total calculated from order item quantities and unit prices."
        data_tests:
          - not_null

      - name: total_items
        description: "Number of order lines associated with the order."
        data_tests:
          - not_null

      - name: total_quantity
        description: "Total number of units purchased in the order."
        data_tests:
          - not_null

      - name: distinct_products
        description: "Number of distinct products in the order."
        data_tests:
          - not_null

      - name: product_categories
        description: "Comma-separated list of product categories in the order."
        data_tests:
          - not_null

  - name: dim_products
    description: "Product dimension containing pricing and profitability attributes."

    columns:
      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Product name."
        data_tests:
          - not_null

      - name: category
        description: "Top-level product category."
        data_tests:
          - not_null

      - name: unit_cost
        description: "Product acquisition cost."
        data_tests:
          - not_null

      - name: list_price
        description: "Product selling price."
        data_tests:
          - not_null

      - name: profit_margin
        description: "Absolute margin between list price and unit cost."
        data_tests:
          - not_null

      - name: profit_margin_pct
        description: "Profit margin expressed as a percentage of list price."
        data_tests:
          - not_null


  - name: fct_payments
    description: "Analytics-ready payment fact table at one row per payment attempt."

    columns:
      - name: payment_id
        description: "Unique identifier for each payment attempt."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the payment attempt."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: payment_date
        description: "Timestamp when the payment was attempted."
        data_tests:
          - not_null

      - name: payment_method
        description: "Method used for the payment attempt."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['UPI', 'CARD']

      - name: payment_status
        description: "Outcome of the payment attempt."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['success', 'failed', 'pending']

      - name: payment_amount
        description: "Amount associated with the payment attempt."
        data_tests:
          - not_null

      - name: payment_currency
        description: "Currency of the payment amount."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['INR', 'USD', 'GBP']

      - name: successful_payment_amount
        description: "Payment amount counted only for successful attempts."
        data_tests:
          - not_null
