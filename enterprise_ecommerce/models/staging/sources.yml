version: 2

sources:
  - name: ecommerce_raw
    description: "Raw e-commerce tables loaded into Databricks."

    database: ecommerce_dev
    schema: raw

    tables:

      - name: customers
        description: "Raw customer records from the source customer system."
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour

      - name: orders
        description: "Raw order records from the source order system."
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour

      - name: order_items
        description: "Raw order-line records from the source order system."
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour