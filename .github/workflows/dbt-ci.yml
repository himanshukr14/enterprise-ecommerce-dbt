name: dbt CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.3 dbt-databricks==1.12.5

      - name: Create dbt profile
        working-directory: enterprise_ecommerce
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<EOF
          enterprise_ecommerce:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: ecommerce_dev
                schema: dbt_ci
                host: $DATABRICKS_HOST
                http_path: $DATABRICKS_HTTP_PATH
                token: $DATABRICKS_TOKEN
                threads: 4
          EOF

      - name: Verify dbt installation
        working-directory: enterprise_ecommerce
        run: dbt --version

      - name: dbt parse
        working-directory: enterprise_ecommerce
        run: dbt parse --no-partial-parse

      - name: Download dbt state artifact (PR)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          RUN_ID=$(gh run list \
            --workflow dbt-ci.yml \
            --commit "$BASE_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "No successful main dbt CI run found for base SHA: $BASE_SHA"
            exit 1
          fi

          mkdir -p enterprise_ecommerce/state
          gh run download "$RUN_ID" \
            --name dbt-state \
            --dir enterprise_ecommerce/state

      - name: dbt build (PR - Slim CI)
        if: github.event_name == 'pull_request'
        working-directory: enterprise_ecommerce
        run: dbt build --select state:modified+ --state state --defer

      - name: dbt build (main - Full Refresh)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: enterprise_ecommerce
        run: dbt build --full-refresh

      - name: Generate dbt docs
        working-directory: enterprise_ecommerce
        run: dbt docs generate

      - name: Upload dbt state artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-state
          path: enterprise_ecommerce/target/manifest.json
          retention-days: 7
